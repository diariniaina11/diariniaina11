name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    # Autorise l'écriture pour que l'action puisse pousser sur GitHub Pages
    permissions:
      contents: write

    steps:
      # 1. Cloner le dépôt pour préparer la génération
      - uses: actions/checkout@v4

      # 2. Générer le Snake avec votre profil GitHub
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Publier les fichiers SVG générés sur la branche de déploiement
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}