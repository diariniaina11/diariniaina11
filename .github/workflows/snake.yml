name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # Indispensable pour donner les droits d'écriture à GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # 1. Cloner le dépôt pour que l'action puisse travailler dedans
      - uses: actions/checkout@v4

      # 2. Générer le Snake avec votre profil
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Publier le dossier dist/ sur GitHub Pages
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}